<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LobsterBoard - Claude Usage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }
    .container { max-width: 700px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .sub-header { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 1.4rem; margin-bottom: 1.2rem; }
    .card h2 { font-size: 0.95rem; color: #8b949e; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    .meter { margin-bottom: 1.2rem; }
    .meter:last-child { margin-bottom: 0; }
    .meter-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .meter-label { font-weight: 600; font-size: 0.95rem; }
    .meter-value { font-size: 1.3rem; font-weight: 700; }
    .meter-bar { background: #21262d; border-radius: 6px; height: 10px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
    .meter-sub { text-align: right; margin-top: 4px; font-size: 0.8rem; color: #8b949e; }
    .green { color: #3fb950; }
    .yellow { color: #d29922; }
    .red { color: #f85149; }
    .bg-green { background: #3fb950; }
    .bg-yellow { background: #d29922; }
    .bg-red { background: #f85149; }
    .extra-row { display: flex; justify-content: space-between; padding-top: 0.8rem; border-top: 1px solid #30363d; margin-top: 0.4rem; }
    .extra-label { color: #8b949e; font-size: 0.9rem; }
    .extra-value { font-weight: 600; font-size: 0.95rem; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: #1f6feb33; color: #58a6ff; margin-left: 8px; }
    .loading { color: #8b949e; text-align: center; padding: 2rem; font-style: italic; }
    .error { color: #f85149; text-align: center; padding: 2rem; }
    .refresh-info { color: #484f58; font-size: 0.75rem; text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav id="page-nav"></nav>
  <main class="container">
    <h1>🤖 Claude Usage</h1>
    <div class="sub-header" id="plan-info">Loading...</div>

    <div class="card" id="usage-card">
      <div class="loading">Loading usage data...</div>
    </div>

    <div class="refresh-info" id="refresh-info"></div>
  </main>

  <script src="/pages/_shared/nav.js"></script>
  <script>
    function barClass(pct) {
      if (pct >= 80) return 'red';
      if (pct >= 50) return 'yellow';
      return 'green';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function timeLeft(iso) {
      if (!iso) return '';
      const ms = new Date(iso) - Date.now();
      if (ms <= 0) return 'just now';
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      if (h > 24) return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
      return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
    }

    function metricPercent(metric) {
      if (!metric || !Number.isFinite(Number(metric.used))) return 0;
      if (metric.format === 'percent') return Number(metric.used);
      if (Number.isFinite(Number(metric.limit)) && Number(metric.limit) > 0) {
        return (Number(metric.used) / Number(metric.limit)) * 100;
      }
      return 0;
    }

    function metricValue(metric) {
      if (!metric || !Number.isFinite(Number(metric.used))) return '—';
      if (metric.format === 'dollars') {
        const used = '$' + Number(metric.used).toFixed(2);
        return Number.isFinite(Number(metric.limit)) && Number(metric.limit) > 0
          ? used + ' / $' + Number(metric.limit).toFixed(2)
          : used;
      }
      if (metric.format === 'percent') return Math.round(Number(metric.used)) + '%';
      return String(metric.used);
    }

    function renderMeter(metric) {
      const p = Math.min(100, Math.max(0, metricPercent(metric)));
      const cls = barClass(p);
      const reset = metric.resetsAt ? `<div class="meter-sub">resets in ${escapeHtml(timeLeft(metric.resetsAt))}</div>` : '';
      return `<div class="meter">
        <div class="meter-header">
          <span class="meter-label">${escapeHtml(metric.label)}</span>
          <span class="meter-value ${cls}">${escapeHtml(metricValue(metric))}</span>
        </div>
        <div class="meter-bar"><div class="meter-fill bg-${cls}" style="width:${p}%"></div></div>
        ${reset}
      </div>`;
    }

    function normalizeMetrics(d) {
      if (Array.isArray(d.metrics)) return d.metrics;
      const metrics = [];
      if (d.five_hour) metrics.push({ label: 'Session (5h)', used: d.five_hour.utilization, format: 'percent', resetsAt: d.five_hour.resets_at });
      if (d.seven_day) metrics.push({ label: 'Weekly', used: d.seven_day.utilization, format: 'percent', resetsAt: d.seven_day.resets_at });
      if (d.seven_day_opus) metrics.push({ label: 'Opus Weekly', used: d.seven_day_opus.utilization, format: 'percent', resetsAt: d.seven_day_opus.resets_at });
      if (d.seven_day_sonnet) metrics.push({ label: 'Sonnet Weekly', used: d.seven_day_sonnet.utilization, format: 'percent', resetsAt: d.seven_day_sonnet.resets_at });
      if (d.extra_usage && d.extra_usage.is_enabled) {
        metrics.push({
          label: 'Extra Credits',
          used: d.extra_usage.used_credits / 100,
          limit: d.extra_usage.monthly_limit ? d.extra_usage.monthly_limit / 100 : null,
          format: 'dollars'
        });
      }
      return metrics;
    }

    function renderError(message) {
      return `<div class="error">${escapeHtml(message || 'Claude usage is unavailable.')}</div>`;
    }

    async function loadUsage() {
      const card = document.getElementById('usage-card');
      const planEl = document.getElementById('plan-info');
      const refreshEl = document.getElementById('refresh-info');

      try {
        const res = await fetch('/api/pages/claude-usage/usage');
        const d = await res.json();

        if (d.error || d.status === 'error') {
          const message = d.error || d.message || 'Claude usage is unavailable.';
          planEl.textContent = 'Claude Code';
          card.innerHTML = renderError(message);
          refreshEl.textContent = 'Last checked: ' + new Date().toLocaleTimeString();
          return;
        }

        const labels = { max: 'Max (5×)', pro: 'Pro', free: 'Free' };
        const planName = labels[d.subscription || d.plan] || d.subscription || d.plan || 'Claude Code';
        const tierLabel = d.tier ? d.tier.replace('default_claude_', '').replace(/_/g, ' ') : '';
        planEl.innerHTML = `${escapeHtml(planName)} plan` + (tierLabel ? `<span class="badge">${escapeHtml(tierLabel)}</span>` : '');

        const html = normalizeMetrics(d).map(renderMeter).join('');

        card.innerHTML = html || '<div class="loading">Claude returned no usage meters.</div>';
        refreshEl.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
      } catch (e) {
        planEl.textContent = 'Claude Code';
        card.innerHTML = renderError('Failed to load Claude usage: ' + e.message);
      }
    }

    loadUsage();
    setInterval(loadUsage, 120000);
  </script>
</body>
</html>
