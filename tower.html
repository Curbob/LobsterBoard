<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobster Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The tower is a fixed dusk-to-night illustration, so its palette does not follow the system theme. */
:root {
  color-scheme: dark;
  --shell: #4a4448; --shell-edge: #5d5659; --slab: #3a3437;
  --ink: #fbf3e6; --ink-soft: #c9bfd8; --ink-dark: #2b2620;
  --neon: #ff5a3c; --ok: #5fd39a; --warn: #ffbe4d; --sleep: #93aef5; --gym: #cf96f7; --bad: #ff5a4f;
  --panel: #241f33; --panel-edge: #3d3554;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
:root[data-theme="light"], :root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #2a2238; color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; display: flex; flex-direction: column; }
img { max-width: none; }
#sky { position: fixed; inset: 0; z-index: 0; transition: background 2s; }
#weather { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#flash { position: fixed; inset: 0; z-index: 2; background: #fff; opacity: 0; pointer-events: none; }
header, main { position: relative; z-index: 3; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 16px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border-bottom: 1px solid var(--panel-edge); }
h1 { font: 700 20px var(--f-display); margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--neon); }
.back { color: var(--ink-soft); text-decoration: none; font-size: 13px; }
.back:hover { color: var(--ink); }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
select, button { font: 500 12px var(--f-body); color: var(--ink); background: #342d48; border: 1px solid var(--panel-edge); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
button:hover, select:hover { background: #41395a; }
:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.switch[aria-pressed="true"] { background: #5a3d2c; border-color: var(--neon); }
.counts { margin-left: auto; display: flex; gap: 10px; font: 12px var(--f-mono); color: var(--ink-soft); flex-wrap: wrap; }
.counts b { font-weight: 500; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px 16px 12px; }
#tower { position: relative; }

/* roof */
.roofband { position: absolute; left: 0; right: 0; top: 0; }
.parapet { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, var(--shell-edge), var(--shell)); border-radius: 6px 6px 0 0; }
.sign { position: absolute; font: 700 1em var(--f-display); color: var(--neon); letter-spacing: .05em; white-space: nowrap;
  text-shadow: 0 0 6px rgba(255,90,60,.9), 0 0 22px rgba(255,90,60,.5); transform: translateX(-50%); }
.roofart { position: absolute; }
.roofart img { display: block; width: 100%; height: 100%; }
.dial { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); }
.dial .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; background: #2b2620; border-radius: 3px; }
.dial .hour { width: 5%; height: 26%; }
.dial .minute { width: 3.2%; height: 38%; }
.dial .pin { position: absolute; left: 50%; top: 50%; width: 8%; height: 8%; border-radius: 50%; background: #c9a24f; transform: translate(-50%, -50%); }
.lcd { position: absolute; display: grid; place-items: center; overflow: hidden; color: #ffcf6a; font-family: var(--f-mono); font-weight: 600; letter-spacing: .08em; text-shadow: 0 0 6px rgba(255, 190, 80, .8); white-space: nowrap; }
.wxscreen { color: #7dffb0; text-shadow: 0 0 8px rgba(80, 255, 160, .8); grid-template-rows: auto auto auto; align-content: center; padding: 0; line-height: 1.05; gap: 3%; }
.wx-icon { font-size: 1.3em; text-shadow: none; }
.wx-temp { font-size: 2em; font-family: var(--f-display); }
.wx-kind { font-size: .8em; letter-spacing: .12em; }
.billboard { position: absolute; background: #1a1418; border: 3px solid #6b5e45; border-radius: 4px; color: #ffcf6a; display: grid; place-items: center; text-align: center; font: 600 10px var(--f-mono); line-height: 1.2; }
.billboard b { font: 700 1.6em var(--f-display); color: #fff3c4; display: block; }
.snowcap { position: absolute; left: 0; right: 0; top: -6px; height: 8px; border-radius: 6px; background: #fff; opacity: 0; transition: opacity 3s; }
body.snow .snowcap { opacity: .95; }

.slab { position: absolute; background: var(--slab); box-shadow: inset 0 2px 0 var(--shell-edge); }
.floorno { position: absolute; z-index: 4; font: 600 10px var(--f-mono); color: var(--ink-soft); text-align: center; }

/* rooms */
.room { position: absolute; overflow: hidden; cursor: pointer; background: #000 center / cover no-repeat; }
.room:focus-visible { outline: 3px solid var(--warn); outline-offset: -3px; }
.room.ph { background: linear-gradient(180deg, #d9c3a0 0%, #caa97c 70%, #8a6a48 70%, #a07c55 100%); }
.room.ph::before { content: attr(data-icon); position: absolute; right: 8%; top: 12%; font-size: 2.2em; opacity: .25; }
.room.ph .phnote { position: absolute; right: 6px; bottom: 4px; font: 500 9px var(--f-mono); color: rgba(43, 38, 32, .6); }
.room.hall { background: #6b5a4d url(tower/assets/room-hall.webp) left center / auto 100% repeat-x; cursor: default; }   /* a hallway that repeats to fill any gap */
.room.agentwall { background: radial-gradient(ellipse at 50% 30%, #2b2f4a, #12121e 75%); }
.room.tile { background-size: auto 100%; background-repeat: repeat-x; background-position: left center; }
.room.alerting::after { content: ""; position: absolute; inset: 0; background: rgba(255, 60, 50, .28); animation: alarm 1s steps(2) infinite; pointer-events: none; z-index: 7; }
@keyframes alarm { 50% { opacity: 0; } }
.plate { position: absolute; left: 5px; top: 5px; z-index: 8; padding: 1px 7px; border-radius: 5px; background: rgba(20, 16, 28, .74);
  font: 600 10px var(--f-display); letter-spacing: .03em; white-space: nowrap; max-width: calc(100% - 10px); overflow: hidden; text-overflow: ellipsis; }
.prop { position: absolute; transform: translateX(-50%); pointer-events: none; }
.prop img { display: block; width: 100%; height: auto; }
.prop.front { z-index: 6; }
.desk { position: absolute; transform: translateX(-50%); background: linear-gradient(180deg, #8a5a32, #6d4424); border-radius: 3px 3px 0 0; z-index: 6; box-shadow: inset 0 3px 0 #a9744a; }
.desk::after { content: ""; position: absolute; left: 30%; width: 34%; bottom: 100%; height: 70%; background: #1d2433; border: 2px solid #444; border-radius: 2px; }
.wall { position: absolute; z-index: 2; background: linear-gradient(90deg, #2c2729, #4d4548 50%, #2c2729); }
.lintel { position: absolute; z-index: 4; background: linear-gradient(180deg, #c99a5a, #8b6233); }

/* wall pieces (display-only widgets) */
.piece { position: absolute; transform: translateX(-50%); z-index: 3; font: 600 9px var(--f-mono); text-align: center; color: #fff3c4; pointer-events: none; }
.piece.board { background: #1a1418; border: 2px solid #6b5e45; border-radius: 3px; padding: 2px 4px; }
.piece.lamps { display: flex; gap: 4px; padding: 3px 5px; background: #2a2a2a; border-radius: 3px; }
.piece.lamps i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 5px var(--ok); }
.piece.lamps i.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); animation: alarm 1s steps(2) infinite; }
.piece.cork { background: #b98a55; border: 3px solid #7a5532; color: var(--ink-dark); padding: 3px; }
.piece.cork span { display: block; background: #fff8c4; padding: 2px 3px; font: 500 8px var(--f-body); transform: rotate(-3deg); }
.piece.frame { border: 4px solid #c9a24f; box-shadow: 0 0 0 1px #6b5e45, 0 2px 4px rgba(0,0,0,.4); }
.piece.frame.spot { box-shadow: 0 0 0 1px #6b5e45, 0 0 18px 6px rgba(255, 236, 170, .55); }
.piece.plaque { background: linear-gradient(180deg, #e0bb62, #a8802f); color: #2b2620; padding: 2px 5px; border-radius: 2px; }
.piece.plaque.glow { box-shadow: 0 0 10px 3px #ffcf6a; animation: alarm 1.2s steps(2) infinite; }
.piece.chalk { background: #2f4a3a; border: 3px solid #8a6a48; color: #f2f2e6; padding: 3px 5px; font: 500 8px var(--f-body); }
.piece.clocks { display: flex; gap: 6px; }
.piece.clocks div { display: grid; justify-items: center; gap: 1px; }
.piece.clocks .cf { border-radius: 50%; background: #fff8e6; border: 2px solid #c9a24f; position: relative; }
.piece.clocks .cf i { position: absolute; left: 50%; bottom: 50%; width: 1.5px; transform-origin: 50% 100%; background: #2b2620; }
.panel { position: absolute; border-radius: 4px; background: #1b1f33; border: 1px solid #39406a; padding: 3px 4px; overflow: hidden; z-index: 3; transition: box-shadow .6s, border-color .6s, opacity .6s; }
.panel .nm { font: 600 8px var(--f-display); color: #dfe5ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel .bar { height: 3px; background: #2c3150; border-radius: 2px; margin-top: 2px; overflow: hidden; }
.panel .bar i { display: block; height: 100%; background: #7aa2ff; transition: width 1s; }
.panel.idle { opacity: .55; }
.panel.working { border-color: #7aa2ff; box-shadow: 0 0 10px #4f6fe0; animation: pulse 1.6s ease-in-out infinite; }
.panel.near { border-color: var(--warn); box-shadow: 0 0 10px #c98a1d; }
.panel.near .bar i { background: var(--warn); }
.panel.limited, .panel.error { border-color: var(--bad); box-shadow: 0 0 12px #d0332a; }
.panel.limited .bar i, .panel.error .bar i { background: var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 4px #4f6fe0; } }

/* elevators */
.shaft { position: absolute; z-index: 1; background: url(tower/assets/shaft.webp) center top repeat-y; box-shadow: inset 0 0 0 3px var(--shell); }
.cab { position: absolute; z-index: 3; }
.cab img { width: 100%; height: 100%; display: block; }
.cable { position: absolute; z-index: 2; width: 3px; background: linear-gradient(90deg, #555, #aaa, #555); }
.gate { position: absolute; z-index: 7; transform-origin: left center; transition: transform .45s ease-in-out;
  background: repeating-linear-gradient(45deg, transparent 0 7px, #c9a24f 7px 9px), repeating-linear-gradient(-45deg, transparent 0 7px, #a8802f 7px 9px);
  border-left: 2px solid #e0bb62; border-right: 2px solid #e0bb62; }
.gate.open { transform: scaleX(.08); }

/* avatars */
.av { position: absolute; z-index: 5; pointer-events: none; }
.av .fig { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); }
.av .fig img { display: block; height: 100%; width: auto; }
.av.flip .fig img, .av.flip .fig svg { transform: scaleX(-1); }
.av .fig svg { display: block; height: 100%; width: auto; overflow: visible; }
.av .tag { position: absolute; left: 0; transform: translateX(-50%); bottom: 100%; margin-bottom: 1px; white-space: nowrap;
  font: 600 9px var(--f-display); background: rgba(20, 16, 28, .8); padding: 0 5px; border-radius: 4px; }
.av.riding { z-index: 4; }
.av.alert .tag { background: var(--bad); color: #fff; }
.av.sleep .tag { color: var(--sleep); }
.av.idle .tag { color: var(--warn); }
.av.gym .tag { color: var(--gym); }
.bag { position: absolute; z-index: 4; transform: translateX(-50%); border-radius: 40% 10px 10px 40%; background: linear-gradient(180deg, #4a6fb5, #2f4f8f); pointer-events: none; }
.belt-box { position: absolute; z-index: 4; pointer-events: none; }
.belt-box img { display: block; width: 100%; height: auto; }

/* card popup */
dialog { border: 1px solid var(--panel-edge); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(10, 8, 18, .6); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--panel-edge); }
.dlg-head h2 { font: 700 18px var(--f-display); margin: 0; flex: 1; }
.dlg-body { padding: 12px 16px 16px; display: grid; gap: 10px; overflow: auto; }
.card { border: 1px solid var(--panel-edge); border-radius: 8px; padding: 10px 12px; background: #1d1929; }
.card h3 { margin: 0 0 4px; font: 600 14px var(--f-display); display: flex; align-items: center; gap: 8px; }
.card .read { font: 13px var(--f-mono); color: var(--ink-soft); }
.chip { font: 500 11px var(--f-body); padding: 1px 8px; border-radius: 99px; background: #342d48; }
.states { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.states button[aria-pressed="true"] { background: #5a3d2c; border-color: var(--neon); }
.hint { font-size: 12px; color: var(--ink-soft); margin: 0; }
@media (prefers-reduced-motion: reduce) { .gate, .panel { transition: none; animation: none; } .room.alerting::after { animation: none; } }
</style>
</head>
<body>
<div id="sky"></div><canvas id="weather"></canvas><div id="flash"></div>
<header>
  <a class="back" href="/">← Dashboard</a>
  <h1>Lobster <span>Tower</span></h1>
  <button class="switch" id="demo" aria-pressed="true" title="Simulated data for every kept widget">Demo mode</button>
  <label class="ctl">Dashboard <select id="preset"><option value="all">Everything</option><option value="media">Media server</option><option value="homelab">Homelab</option><option value="developer">Developer</option></select></label>
  <label class="ctl">Weather <select id="wx"><option value="auto">Demo cycle</option><option>clear</option><option>clouds</option><option>rain</option><option>snow</option><option>storm</option><option>fog</option></select></label>
  <button id="rooms-btn" title="Choose which rooms the tower shows">Rooms</button>
  <label class="ctl">Time <select id="tod"><option value="live">Live</option><option value="6.5">Dawn</option><option value="12">Day</option><option value="18.6">Dusk</option><option value="23">Night</option></select></label>
  <div class="counts" id="counts" aria-live="polite"></div>
</header>
<main><div id="tower" aria-label="Lobster Tower: each room is a widget on your dashboard"></div></main>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg-head"><h2 id="dlg-title"></h2><button id="dlg-close">Close</button></div><div class="dlg-body" id="dlg-body"></div></dialog>

<script src="js/tower/catalog.js"></script>
<script src="js/tower/live.js"></script>
<script src="js/tower/engine.js"></script>
</body>
</html>
